<html data-xhr-callback="Playground.xhrCallback">

<head>
    <script data-reload="false" type="text/javascript">
        var root = location.pathname;
        var playground = root.split('/').shift();
        root = '127.0.0.1' === location.hostname || 'localhost' === location.hostname ? '/' : playground;
        document.write('<base href="' + root + '">');
    </script>
    <script data-reload="false" type="text/javascript" src="scripts.js"></script>
    <script data-reload="false" type="text/javascript" src="libs.js"></script>
    <script data-reload="false" type="text/javascript" src="storage.js"></script>
    <script data-reload="false" type="text/javascript" src="examples/index.js"></script>
    <script data-reload="false" type="text/javascript" src="files.js"></script>
    <script data-reload="false" type="module" src="bootstrap.js"></script>
</head>

</html>
