<html>

<head>
    <script type="text/javascript">
        var root = location.pathname;
        var baseHref = root.substring(1).split('/').shift();
        baseHref = 0 === root.indexOf('/preload') ? '' : baseHref;
        if (!baseHref.startsWith('/')) baseHref = '/' + baseHref;
        if (!baseHref.endsWith('/')) baseHref += '/';
        document.write('<base href="' + baseHref + '">');
        document.write('<script src="' + baseHref + 'examples/index.js"><' + '/script>');
    </script>
    <script type="text/javascript">
        var storage = [];
        examples.forEach((example) => {
            storage.push(`examples/${example}.phar`);
        });
        storage.push('src/Controller/HomeController.php');
        storage.push('src/Controller/ExamplesController.php');
        storage.push('templates/_menu.tbs.html');
        storage.push('templates/home.tbs.html');
        storage.push('templates/examples.tbs.html');

        var proxy = ['localhost', '127.0.0.1'].includes(location.hostname) ? ('./source.php?refresh=' + new Date().getTime() + '&file=') : 'https://cdn.jsdelivr.net/gh/michael-barchy/koncerto-playground@ddb637350d82834e5cb2e1224aa3fced7e014b92';
        document.write('<script id="bootstrap" type="module" src="' + baseHref + 'bootstrap.mjs" data-storage="' + storage.join(',') + '" data-proxy="' + proxy + '"><' + '/script>');
    </script>
</head>

</html>
